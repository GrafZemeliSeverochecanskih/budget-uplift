[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uplift-alloc"
version = "0.1.0"
description = "Budget-constrained promotion targeting from an RCT (Hillstrom): RCT analysis, uplift models, allocation, off-policy evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "econml==0.17.0",
    "scikit-uplift==0.5.1",
    "statsmodels==0.15.0",
    "ortools==9.15.6755",
    "matplotlib==3.11.2",
    "networkx==3.7",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Only needed for the LLM-embedding extension (pulls in torch).
llm = ["sentence-transformers==6.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the downloaded Hillstrom data (run `make data` first)"]
